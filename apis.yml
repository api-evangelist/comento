name: Comento
description: >-
  Comento is a South Korean career development and mentoring platform based in
  Seoul that connects job seekers with working professionals. The service offers
  a Q&A community and timeline for career discussions, free unlimited mentoring
  questions answered by industry practitioners, resume and cover letter (자기소개서)
  review, an AI resume analyzer, interview preparation, and job-focused
  educational programs including bootcamps (직무부트캠프) and classes for the Korean
  job market. It also runs corporate training and university affiliation
  partnerships. Comento operates as a consumer-facing web platform and does not
  publish a public developer API or documentation surface; this profile was
  surfaced as a portfolio company of 500 Global and enriched with the domain and
  identity signals that are publicly observable.
